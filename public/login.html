<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your notes workspace.">
  <title>Login — Notes Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card">
      <div class="brand auth-brand"><span class="brand-mark">N</span><span>NoteSpace</span></div>
      <p class="eyebrow">WELCOME</p>
      <h1>Log in to your notes</h1>
      <p class="auth-description">Enter any username and password to continue.</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="save-btn auth-submit" id="loginButton" type="submit">Login</button>
      </form>
    </section>
  </main>
  <script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      loginError.textContent = "";
      if (!username || !password) {
        loginError.textContent = "Enter both a username and password.";
        return;
      }

      loginButton.disabled = true;
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error || "Login failed.");
        }
        localStorage.setItem("username", username);
        window.location.replace("index.html");
      } catch (error) {
        loginError.textContent = error.message || "Could not log in. Check that the app server is running.";
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
